spring.main.banner-mode=off
spring.jmx.enabled=false
logging.level.root=warn

# Virtual threads: one cheap thread per request instead of a bounded platform pool.
spring.threads.virtual.enabled=${BENCH_VIRTUAL_THREADS:true}

server.port=${BENCH_PORT:8000}
# Tomcat closes keep-alive connections after 100 requests by default; granian never does.
server.tomcat.max-keep-alive-requests=-1
server.tomcat.accept-count=1024
server.tomcat.threads.max=${BENCH_TOMCAT_THREADS:200}

spring.jackson.property-naming-strategy=SNAKE_CASE

# Same total DB connections as the Python apps (32).
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/bench
spring.datasource.username=postgres
spring.datasource.hikari.maximum-pool-size=${BENCH_POOL_SIZE:32}
spring.datasource.hikari.minimum-idle=${BENCH_POOL_SIZE:32}
spring.datasource.hikari.auto-commit=true
